<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin sign in | ICGL</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="pages/admin.css" />
  </head>
  <body>
    <main class="signin">
      <div class="signin-box">
        <div class="eyebrow">ICGL workspace</div>
        <h1 class="display">Welcome back.</h1>
        <p class="muted">Sign in to manage the public-facing content system.</p>
        <form class="form" data-demo-form>
          <input required type="email" placeholder="Email address" /><input
            required
            type="password"
            placeholder="Password" /><button class="btn btn-dark" type="submit">
            Sign in ↗
          </button>
        </form>
        <div class="notice hidden">
          Signed in for this static preview. The API session can be connected
          next.
        </div>
        <p class="signin-note">
          <a href="index.html">← Return to public site</a>
        </p>
      </div>
    </main>
    <script src="interaction.js"></script>
  </body>
</html>
